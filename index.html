<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="darkMode">Dark Mode</button>
    <div class="container">
        
    <form id="pokemonForm">
        <input type="text" placeholder="Enter pokemon name" id="pokemonInput">
        <button type="submit">GET YOUR POKEMON</button>
    </form>
    <br>
    <button type="submit" id="randomButton">Random Pokemon</button>
    <h1 id="pokemonName"></h1>
    <img id="pokemonImage" width="200px">
    <h2 id="pokemonType"></h2>
    <p id="pokemonError"></p>
    </div>
  <script src="script.js"></script>  
</body>
</html>
